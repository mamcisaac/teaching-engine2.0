# Performance Benchmarking & Visual Regression Testing
# Automated testing for Teaching Engine 2.0 non-functional requirements

name: Performance & Visual Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run nightly performance tests
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of testing to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - performance
          - visual
      performance_scenario:
        description: 'Performance test scenario'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - teacher_login_workflow
          - weekly_lesson_planning
          - curriculum_browsing
          - student_management
          - newsletter_generation

env:
  NODE_VERSION: '18'
  PERFORMANCE_TEST_URL: 'http://localhost:3000'
  VISUAL_TEST_BASE_URL: 'http://localhost:5173'

jobs:
  performance_testing:
    name: Performance Benchmarking
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type != 'visual' }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_engine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install
          npm install -g artillery

      - name: Setup Test Database
        run: |
          cd packages/database
          cp .env.example .env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/teaching_engine_test" >> .env.test
          pnpm db:push
          pnpm db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teaching_engine_test

      - name: Start Server for Performance Testing
        run: |
          cd server
          cp .env.example .env.test
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/teaching_engine_test" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "JWT_SECRET=test-secret-key-for-performance-testing" >> .env.test
          pnpm build
          pnpm start &

          # Wait for server to be ready
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/health; do sleep 2; done'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teaching_engine_test

      - name: Run Performance Tests
        run: |
          cd tests/performance
          node scripts/run-performance-suite.js
        env:
          PERFORMANCE_TEST_URL: ${{ env.PERFORMANCE_TEST_URL }}
          TEST_SCENARIO: ${{ github.event.inputs.performance_scenario || 'all' }}

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: tests/performance/results/
          retention-days: 30

      - name: Performance Regression Check
        run: |
          # Compare with baseline performance metrics
          cd tests/performance
          if [ -f "baseline-metrics.json" ]; then
            node scripts/compare-performance-baseline.js
          else
            echo "No baseline metrics found, creating new baseline"
            cp results/latest-results.json baseline-metrics.json
          fi

      - name: Comment Performance Results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './tests/performance/results/';

            if (fs.existsSync(path + 'performance-report.md')) {
              const report = fs.readFileSync(path + 'performance-report.md', 'utf8');
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Performance Test Results\n\n${report}`
              });
            }

  visual_regression_testing:
    name: Visual Regression Testing
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type != 'performance' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: |
          cd client
          npx playwright install --with-deps chromium firefox webkit

      - name: Build Client for Visual Testing
        run: |
          cd client
          pnpm build
        env:
          NODE_ENV: production
          VITE_API_URL: http://localhost:3000/api

      - name: Start Client for Visual Testing
        run: |
          cd client
          pnpm preview --port 5173 &

          # Wait for client to be ready
          timeout 60 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'

      - name: Run Visual Regression Tests
        run: |
          cd tests/visual
          npx playwright test --config=playwright-visual.config.ts
        env:
          VISUAL_TEST_BASE_URL: ${{ env.VISUAL_TEST_BASE_URL }}
          DISABLE_ANIMATIONS: 'true'
          CI: 'true'

      - name: Upload Visual Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-results
          path: |
            tests/visual/visual-test-results/
            tests/visual/test-results/
          retention-days: 30

      - name: Upload Visual Regression Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-failures
          path: tests/visual/test-results/
          retention-days: 30

      - name: Comment Visual Changes on PR
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎨 Visual Regression Detected
              
              Visual changes have been detected in this PR. Please review the uploaded screenshots to ensure the changes are intentional.
              
              📸 Screenshots are available in the "visual-regression-failures" artifact.
              
              If the changes are intentional, update the visual baselines by running:
              \`\`\`bash
              cd tests/visual
              npx playwright test --update-snapshots
              \`\`\`
              `
            });

  accessibility_testing:
    name: Accessibility Visual Testing
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.test_type != 'performance' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: |
          cd client
          npx playwright install --with-deps chromium

      - name: Build Client
        run: |
          cd client
          pnpm build

      - name: Start Client
        run: |
          cd client
          pnpm preview --port 5173 &
          timeout 60 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'

      - name: Run Accessibility Visual Tests
        run: |
          cd tests/visual
          npx playwright test --grep "Accessibility" --config=playwright-visual.config.ts

      - name: Upload Accessibility Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-test-results
          path: tests/visual/visual-test-results/
          retention-days: 30

  performance_monitoring:
    name: Performance Monitoring
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install
          npm install -g artillery

      - name: Run Extended Performance Monitoring
        run: |
          cd tests/performance
          # Run extended performance tests for trend analysis
          node scripts/run-extended-monitoring.js
        env:
          MONITORING_DURATION: '30m'
          ALERT_WEBHOOKS: ${{ secrets.PERFORMANCE_ALERT_WEBHOOK }}

      - name: Store Performance Metrics
        run: |
          # Store results for historical trending
          cd tests/performance
          node scripts/store-metrics.js
        env:
          METRICS_STORAGE_URL: ${{ secrets.METRICS_STORAGE_URL }}

      - name: Generate Performance Trend Report
        run: |
          cd tests/performance
          node scripts/generate-trend-report.js

      - name: Upload Monitoring Results
        uses: actions/upload-artifact@v4
        with:
          name: performance-monitoring-${{ github.run_number }}
          path: tests/performance/monitoring/
          retention-days: 90

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [performance_testing, visual_regression_testing, accessibility_testing]
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Generate Combined Test Report
        run: |
          echo "# 📊 Teaching Engine 2.0 - Performance & Visual Testing Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "Generated: $(date)" >> test-summary.md
          echo "" >> test-summary.md

          if [ -d "performance-test-results" ]; then
            echo "## 🚀 Performance Testing" >> test-summary.md
            echo "✅ Performance tests completed" >> test-summary.md
            echo "" >> test-summary.md
          fi

          if [ -d "visual-test-results" ]; then
            echo "## 🎨 Visual Regression Testing" >> test-summary.md
            echo "✅ Visual regression tests completed" >> test-summary.md
            echo "" >> test-summary.md
          fi

          if [ -d "accessibility-test-results" ]; then
            echo "## ♿ Accessibility Testing" >> test-summary.md
            echo "✅ Accessibility tests completed" >> test-summary.md
            echo "" >> test-summary.md
          fi

          echo "## 📋 Recommendations" >> test-summary.md
          echo "- Review all test artifacts for any issues" >> test-summary.md
          echo "- Update baselines if visual changes are intentional" >> test-summary.md
          echo "- Address any performance regressions immediately" >> test-summary.md

      - name: Upload Combined Summary
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-summary
          path: test-summary.md
          retention-days: 30
