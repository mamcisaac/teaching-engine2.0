version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    volumes:
      - pact-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact"]
      interval: 10s
      timeout: 5s
      retries: 5

  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact:pact@postgres/pact
      PACT_BROKER_DATABASE_CONNECT_MAX_RETRIES: 5
      PACT_BROKER_BASE_URL: ${PACT_BROKER_BASE_URL:-http://localhost:9292}
      PACT_BROKER_LOG_LEVEL: INFO
      PACT_BROKER_SQL_LOG_LEVEL: DEBUG
      PACT_BROKER_PUBLIC_HEARTBEAT: true
      # Basic auth (for development only)
      PACT_BROKER_BASIC_AUTH_USERNAME: ${PACT_BROKER_USERNAME:-admin}
      PACT_BROKER_BASIC_AUTH_PASSWORD: ${PACT_BROKER_PASSWORD:-admin}
      # Enable features
      PACT_BROKER_FEATURES: publish_pacts_using_old_api
      PACT_BROKER_ALLOW_PUBLIC_READ: true
      PACT_BROKER_ENABLE_PUBLIC_BADGE_ACCESS: true
      # Webhook settings
      PACT_BROKER_WEBHOOK_HTTP_METHOD_WHITELIST: GET,POST,PUT,PATCH,DELETE
      PACT_BROKER_WEBHOOK_SCHEME_WHITELIST: https,http
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9292/diagnostic/status/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: Pact Broker UI enhancement
  pact-broker-ui:
    image: nginx:alpine
    depends_on:
      - pact-broker
    ports:
      - "9293:80"
    volumes:
      - ./pact-broker-nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pact-postgres-data: